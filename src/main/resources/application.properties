spring.application.name=realtimebid

server.port=8080

# --- Database connection ---
# JDBC URL: protocol + host + port + database name.
# "createDatabaseIfNotExist=true" is a safety net; you already made
# the DB yourself, so this just avoids errors if it's ever missing.
spring.datasource.url=jdbc:mysql://localhost:3306/realtimebid?createDatabaseIfNotExist=true

# Your MySQL login — this is the root account you set up earlier
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Tells Spring which JDBC driver class to use to talk to MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate behavior ---
# "update" = Hibernate will auto-create/alter tables to match your
# @Entity classes on startup. Convenient for development.
# (In a real production app you'd use migration tools like Flyway
# instead of letting Hibernate auto-manage schema — we'll touch on
# that later, but "update" is the right choice while learning.)
spring.jpa.hibernate.ddl-auto=update

# Prints the actual SQL Hibernate generates in your console —
# extremely useful while learning, so you can see what's happening
# under the hood instead of it being invisible "magic"
spring.jpa.show-sql=true

# Formats that printed SQL to be readable instead of one long line
spring.jpa.properties.hibernate.format_sql=true

# Tells Hibernate which "dialect" (SQL variant) to generate —
# MySQL has its own quirks vs PostgreSQL/Oracle/etc.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect